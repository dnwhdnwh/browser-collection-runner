name: Browser collection runner
run-name: "Collection ${{ inputs.collection_scope || 'default' }}"
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      max_navigations:
        description: 'Maximum navigations, 1-900'
        type: number
        default: 900
      collection_scope:
        description: 'Approved private collection scope'
        type: choice
        options: [default, scope_1, scope_2, scope_4, scope_5]
        default: default
permissions:
  contents: read
concurrency:
  group: browser-collection-runner
  cancel-in-progress: false
jobs:
  collect:
    permissions:
      contents: read
    outputs:
      needs_catch_up: ${{ steps.run.outputs.needs_catch_up }}
      retry_delay_seconds: ${{ steps.run.outputs.retry_delay_seconds }}
    if: github.repository == 'dnwhdnwh/browser-collection-runner' && vars.COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify runner and browser
        run: |
          npm test
          google-chrome --version
          node browser-smoke.mjs
      - name: Execute verified private bundle
        id: run
        env:
          COLLECTOR_BOOTSTRAP_URL: ${{ secrets.COLLECTOR_BOOTSTRAP_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          COLLECTOR_BUNDLE_SHA256: ${{ secrets.COLLECTOR_BUNDLE_SHA256 }}
          MAX_NAVIGATIONS: ${{ inputs.max_navigations }}
          COLLECTION_SCOPE: ${{ inputs.collection_scope }}
        run: node runner.mjs --max-navigations "${MAX_NAVIGATIONS:-900}" --collection-scope "${COLLECTION_SCOPE:-default}"
  follow_up:
    needs: collect
    if: >-
      ${{ needs.collect.result == 'success' && needs.collect.outputs.needs_catch_up == 'true' &&
          github.repository == 'dnwhdnwh/browser-collection-runner' && vars.COLLECTION_ENABLED == 'true' }}
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request one follow-up execution
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_DELAY_SECONDS: ${{ needs.collect.outputs.retry_delay_seconds }}
          COLLECTION_SCOPE: ${{ inputs.collection_scope }}
        run: |
          node <<'NODE'
          (async()=>{
            const token=process.env.GH_TOKEN;
            delete process.env.GH_TOKEN;
            const delay=process.env.RETRY_DELAY_SECONDS;
            delete process.env.RETRY_DELAY_SECONDS;
            const scope=process.env.COLLECTION_SCOPE||'default';
            delete process.env.COLLECTION_SCOPE;
            try{
              if(!token||!['0','600'].includes(delay)||!['default','scope_1','scope_2','scope_4','scope_5'].includes(scope))throw Error('follow_up_failed');
              if(delay==='600')await new Promise(resolve=>setTimeout(resolve,600000));
              const response=await fetch('https://api.github.com/repos/dnwhdnwh/browser-collection-runner/actions/workflows/collect.yml/dispatches',{method:'POST',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},redirect:'error',signal:AbortSignal.timeout(15000),body:JSON.stringify({ref:'main',inputs:{max_navigations:'900',collection_scope:scope}})});
              if(![200,204].includes(response.status))throw Error('follow_up_failed');
              console.log('follow_up_requested');
            }catch{
              console.error('follow_up_failed');
              process.exitCode=1;
            }
          })();
          NODE
